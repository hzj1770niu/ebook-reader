apply plugin: 'com.android.application'

android {
    namespace 'com.zz.reader.pro'

    signingConfigs {
        release {
            storeFile file('../easyreader.keystore')
            storePassword 'EzReader2026'
            keyAlias 'easyreader'
            keyPassword 'EzReader2026'
        }
    }
    compileSdk 35

    defaultConfig {
        applicationId "com.zz.reader.pro"
        minSdk 21
        targetSdk 33
        versionCode 39
        versionName "5.8"
        resConfigs "zh", "en"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress "onnx"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
